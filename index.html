<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* layout: one-screen terminal. amber title bar, scrolling ledger, five function-key tabs at the bottom */
:root{--bg:#000000;--panel:#0d0c09;--bar:#211e17;--line:#38342a;--amber:#FFA028;--fg:#F3EFE6;--dim:#A39C8B;--up:#35D07F;--dn:#FF6B5E;--cy:#5BC8F5;--gry:#8C8676;--ink:#000000;--mono:'IBM Plex Mono','IBM Plex Sans JP',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:4px 4px 4px 16px;background:var(--amber);color:var(--ink)}
header h1{margin:0;min-width:0;font-size:14px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;gap:4px;flex:none}
.hb button{min-height:44px;padding:0 12px;border:0;background:var(--ink);color:var(--amber);font-size:12px;white-space:nowrap}
.hb button:disabled{opacity:.6}
#ban{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 16px;background:var(--bar);color:var(--cy);font-size:12px}
#ban button{min-height:44px;padding:0 12px;border:1px solid var(--cy);background:var(--bg);color:var(--cy);font-size:12px;white-space:nowrap}
.subt{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1px solid var(--line)}
.subt button{min-height:44px;padding:0 2px;border:0;border-bottom:3px solid transparent;background:none;color:var(--dim);font-size:13px}
.subt button[aria-pressed=true]{border-bottom-color:var(--amber);color:var(--amber);font-weight:700}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 0;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
.lb{font-size:11px;color:var(--dim);letter-spacing:.08em}
.big{font-size:40px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.mid{font-size:28px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}.am{color:var(--amber)}.cy{color:var(--cy)}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.col.e{align-items:flex-end;text-align:right}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.box{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.box.warn{border-color:var(--dn);color:var(--dn);font-size:12px}
.box.att{border-color:var(--amber)}
.box.att p{margin:0;font-size:13px}
.btnrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fl .am{color:var(--amber)}
.meter{height:10px;background:var(--bar)}
.meter i{display:block;height:100%;background:var(--amber)}
.alloc{display:flex;height:14px;gap:2px}
.alloc i{display:block;min-width:2px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px 8px;align-items:center}
.kv4{display:grid;grid-template-columns:14px minmax(0,1fr) auto 56px;gap:10px 8px;align-items:center}
.sw{width:10px;height:10px}
.r{text-align:right}
.gh{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;background:var(--bar);font-size:12px}
.gh.hot{background:var(--amber);color:var(--ink);font-weight:700}
.gh.c3{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px}
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:12px;row-gap:2px;align-items:baseline;width:100%;min-height:48px;padding:8px;border:0;border-bottom:1px solid var(--bar);background:none;text-align:left}
.it.c3{grid-template-columns:minmax(0,1fr) 84px 84px;column-gap:8px}
.it .n{overflow-wrap:anywhere}
.it .s{grid-column:1/-1;font-size:11px;color:var(--dim)}
.it .s.am{color:var(--amber)}
.it .pl{min-width:80px;text-align:right}
.tag{display:inline-block;min-width:34px;margin-right:6px;padding:0 4px;border:1px solid currentColor;font-size:11px;text-align:center}
.note{font-size:11px;color:var(--dim)}
.empty{padding:24px 8px;border:1px dashed var(--line);color:var(--dim);font-size:13px;text-align:center}
.add{position:sticky;bottom:0;margin-top:auto;padding:14px 0 12px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
.btn{display:block;width:100%;min-height:48px;padding:0 10px;border:1px solid var(--amber);background:var(--bg);color:var(--amber);font-weight:700}
.btn.pri{background:var(--amber);color:var(--ink)}
.btn.dgr{border-color:var(--dn);color:var(--dn)}
.btn.sec{border-color:var(--line);color:var(--fg);font-weight:400}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--panel)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0;border:0;background:none;color:var(--dim);font-size:13px}
nav button small{font-size:10px}
nav button[aria-current=page]{background:var(--amber);color:var(--ink);font-weight:700}
svg.ch{display:block;width:100%;height:auto}
#sheet{position:fixed;inset:0;z-index:10;background:var(--panel)}
#sheet .pn{height:100%;max-width:560px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:4px 4px 4px 16px;background:var(--amber);color:var(--ink);font-weight:700;letter-spacing:.06em}
.sh button{min-height:44px;padding:0 14px;border:0;background:var(--ink);color:var(--amber);font-size:12px;font-weight:400}
.sb{padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.sb h2{margin:8px 0 0;font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.08em}
form{display:flex;flex-direction:column;gap:12px;margin:0}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--dim)}
.fl input,.fl select,.fl textarea{width:100%;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--fg);font-size:16px}
.fl textarea{min-height:110px;font-size:12px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--fg);font-size:13px}
.ck input{width:22px;height:22px;accent-color:var(--amber)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{margin:0;color:var(--dn);font-size:12px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;max-width:528px;margin:0 auto;padding:10px 12px;background:var(--fg);color:var(--ink);font-size:13px;text-align:center}
</style>
<div id="app">
<header><h1 id="ttl">資産ターミナル</h1><div class="hb" id="hb"></div></header>
<div id="ban" hidden><span>サンプルデータを表示中</span><button type="button" data-a="clearSample" data-confirm="もう一度押すと消去">消して始める</button></div>
<div id="sub" class="subt" hidden></div>
<main id="main"></main>
<nav id="nav" aria-label="画面切り替え"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
(function(){
'use strict';
var KEY='asset-terminal-v1';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return ymd(new Date())};
var ago=function(n){var d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
var num=function(v){
  if(typeof v==='number')return v;
  var s=String(v==null?'':v).replace(/[０-９．－]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).replace(/[,，\s¥￥円]/g,'');
  if(s==='')return NaN;
  var n=Number(s);return isFinite(n)?n:NaN;
};
var HID='＊＊＊＊';
var S,storageOK=true,busy=false;
var ui={tab:'sum',secTab:'pos',range:'6m',kind:'buy',msg:''};

/* ---------- formatting ---------- */
var f0=function(n){return Math.round(n).toLocaleString('ja-JP')};
var fx2=function(n){return Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2})};
var yen=function(n){return S.settings.hide?HID:f0(n)};
var sgn=function(n){n=Math.round(n);return S.settings.hide?HID:(n>0?'+':n<0?'-':'')+f0(Math.abs(n))};
var pct=function(n){return isFinite(n)?(n>0?'+':n<0?'-':'')+Math.abs(n).toFixed(1)+'%':'—'};
var cls=function(n){return n>0?'up':n<0?'dn':'dim'};
var arrow=function(n){return n>0?'▲ ':n<0?'▼ ':''};
var qf=function(n){return S.settings.hide?HID:Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4})};
var md=function(s){return s?Number(s.slice(5,7))+'/'+Number(s.slice(8,10)):''};
var ys=function(s){return s?s.replace(/-/g,'/'):''};
var stamp=function(ms){if(!ms)return '未取得';var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ---------- state ---------- */
function defSet(o){return Object.assign({target:0,hide:false,lastBackup:null,snooze:null},o||{})}
function blank(){return {v:1,sample:false,settings:defSet(),secs:[],trades:[],margins:[],divs:[],cash:[],fx:{},items:[],history:[],prices:{},lastFetch:null,fetchFail:[]}}
function sample(){
  var s=blank(),t=today(),y=new Date().getFullYear();
  s.sample=true;s.settings.target=20000000;
  var mk=function(type,code,name,broker,unit,p,qty,cost){
    var o={id:uid(),type:type,code:code,name:name,broker:broker,unit:unit,auto:false};s.secs.push(o);
    s.trades.push({id:uid(),secId:o.id,date:ago(200),side:'buy',qty:qty,price:cost,fee:0});
    s.prices[type==='jp'?code:'id:'+o.id]={p:p,at:t,src:'manual'};
  };
  mk('jp','0001','銘柄A','A証券',1,2500,300,2000);
  mk('jp','0002','銘柄B (ETF)','A証券',1,1800,1000,1500);
  mk('jp','0003','銘柄C','A証券',1,3500,200,4000);
  mk('fund','','投資信託D','B証券',10000,15000,2000000,13000);
  mk('other','','その他E','B証券',1,1000000,1,900000);
  s.margins.push({id:uid(),code:'0004',name:'銘柄F',broker:'A証券',side:'long',qty:100,entry:3000,date:ago(20),auto:false});
  s.margins.push({id:uid(),code:'0005',name:'銘柄G',broker:'A証券',side:'short',qty:100,entry:1500,date:ago(12),auto:false});
  s.prices['0004']={p:2800,at:t,src:'manual'};s.prices['0005']={p:1800,at:t,src:'manual'};
  var inYear=function(n){var d=ago(n);return d<y+'-01-01'?y+'-01-01':d};
  s.divs.push({id:uid(),name:'銘柄A',date:inYear(110),amount:36000});
  s.divs.push({id:uid(),name:'銘柄B (ETF)',date:inYear(40),amount:60000});
  [['A銀行 普通','JPY',2000000,3],['B銀行 定期','JPY',1500000,13],['財布・手元現金','JPY',50000,0],['電子マネー','JPY',30000,0],['C銀行 外貨普通','USD',6000,5],['手元の外貨','EUR',125,30]].forEach(function(a){
    s.cash.push({id:uid(),name:a[0],cur:a[1],amount:a[2],at:ago(a[3])});
  });
  s.fx={USD:{rate:150,at:t,src:'manual'},EUR:{rate:160,at:t,src:'manual'}};
  [['腕時計',1400,300000,280000,42],['ノートPC',950,250000,150000,12],['カメラ',1150,180000,120000,59],['自転車',520,120000,95678,217]].forEach(function(a){
    s.items.push({id:uid(),name:a[0],buyDate:ago(a[1]),buyPrice:a[2],value:a[3],valueAt:ago(a[4]),memo:''});
  });
  var now=new Date(),tot=[11200000,11450000,11800000,11650000,12222222];
  for(var i=5;i>=1;i--){s.history.push({date:ymd(new Date(now.getFullYear(),now.getMonth()-i+1,0)),total:tot[5-i]})}
  return s;
}
function load(){
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storageOK=false}
  try{
    var t=localStorage.getItem(KEY);
    if(t){var o=JSON.parse(t);if(o&&o.v===1){var b=blank();Object.keys(o).forEach(function(k){b[k]=o[k]});b.settings=defSet(o.settings);if(!Array.isArray(b.fetchFail))b.fetchFail=[];return b}}
  }catch(e){}
  return sample();
}
function save(){
  recordToday();
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}
}

/* ---------- calculations ---------- */
function pk(sec){return sec.type==='jp'&&sec.code?String(sec.code).toUpperCase():'id:'+sec.id}
function mk_(m){return String(m.code).toUpperCase()}
function dir(m){return m.side==='long'?1:-1}
function calc(){
  var H=[],real=[],yr=String(new Date().getFullYear());
  S.secs.forEach(function(sec){
    var qty=0,cost=0;
    S.trades.filter(function(t){return t.secId===sec.id}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).forEach(function(t){
      var amt=t.qty*t.price/sec.unit,fee=t.fee||0;
      if(t.side==='buy'){qty+=t.qty;cost+=amt+fee}
      else{var avg=qty>0?cost/qty:0;real.push({date:t.date,amt:amt-fee-avg*t.qty});cost-=avg*t.qty;qty-=t.qty;if(qty<1e-9){qty=0;cost=0}}
    });
    var p=S.prices[pk(sec)],value=p?qty*p.p/sec.unit:cost;
    H.push({sec:sec,qty:qty,cost:cost,avg:qty?cost/qty*sec.unit:0,p:p,value:value,pl:p?value-cost:0});
  });
  var M=[];
  S.margins.forEach(function(m){
    if(m.closed){real.push({date:m.closeDate,amt:(m.closePrice-m.entry)*m.qty*dir(m)});return}
    var p=S.prices[mk_(m)];M.push({m:m,p:p,pl:p?(p.p-m.entry)*m.qty*dir(m):0});
  });
  var held=H.filter(function(h){return h.qty>0});
  var sum=function(a,f){return a.reduce(function(x,y){return x+f(y)},0)};
  var cash=S.cash.map(function(c){var rate=c.cur==='JPY'?1:(S.fx[c.cur]?S.fx[c.cur].rate:null);return {c:c,rate:rate,jpy:rate==null?0:c.amount*rate}});
  var C={H:H,held:held,M:M,cash:cash};
  C.secVal=sum(held,function(h){return h.value});C.secCost=sum(held,function(h){return h.cost});C.secPL=C.secVal-C.secCost;
  C.marginPL=sum(M,function(x){return x.pl});C.secTotal=C.secVal+C.marginPL;
  C.cashVal=sum(cash,function(x){return x.jpy});
  C.itemsVal=sum(S.items,function(i){return i.value||0});C.itemsCost=sum(S.items,function(i){return i.buyPrice||0});
  C.total=C.secTotal+C.cashVal+C.itemsVal;
  C.realYear=sum(real.filter(function(r){return String(r.date).slice(0,4)===yr}),function(r){return r.amt});
  C.divYear=sum(S.divs.filter(function(d){return String(d.date).slice(0,4)===yr}),function(d){return d.amount});
  return C;
}
function recordToday(){
  if(!(S.secs.length||S.cash.length||S.items.length||S.margins.length))return;
  var t=today(),total=Math.round(calc().total),r=S.history.find(function(h){return h.date===t});
  if(r){if(!r.manual)r.total=total}else S.history.push({date:t,total:total});
  S.history.sort(function(a,b){return a.date<b.date?-1:1});
}
function prevMonthRec(){
  var d=new Date(),first=ymd(new Date(d.getFullYear(),d.getMonth(),1)),r=null;
  S.history.forEach(function(h){if(h.date<first)r=h});return r;
}

/* ---------- price / fx fetch ---------- */
var PROX=[function(u){return u},function(u){return 'https://r.jina.ai/'+u},function(u){return 'https://corsproxy.io/?url='+encodeURIComponent(u)},function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u)},function(u){return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)}];
var goodProx=null;
function getText(url,ms){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||6000);
  return fetch(url,{signal:c.signal,cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).finally(function(){clearTimeout(t)});
}
function getJSON(url,ms){return getText(url,ms).then(function(t){return JSON.parse(t)})}
function pickJSON(t){
  var i=t.indexOf('{"chart"');if(i<0)i=t.indexOf('{');if(i<0)throw new Error('no json');
  try{return JSON.parse(t.slice(i))}catch(e){return JSON.parse(t.slice(i,t.lastIndexOf('}')+1))}
}
async function quoteJP(code){
  var u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(code)+'.T?interval=1d&range=1d';
  var order=goodProx!=null?[goodProx]:[1,2,3,4,0];
  for(var k=0;k<order.length;k++){
    try{
      var j=pickJSON(await getText(PROX[order[k]](u),order[k]===1?12000:6000));
      var m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;
      if(m&&isFinite(m.regularMarketPrice)){goodProx=order[k];return {p:m.regularMarketPrice,name:m.shortName||m.longName||''}}
    }catch(e){}
  }
  return null;
}
async function fetchFX(){
  var curs=[];S.cash.forEach(function(c){if(c.cur!=='JPY'&&curs.indexOf(c.cur)<0)curs.push(c.cur)});
  if(!curs.length)return {n:0,ok:0};
  var rates=null;
  try{var a=await getJSON('https://open.er-api.com/v6/latest/JPY');if(a&&a.rates)rates=a.rates}catch(e){}
  if(!rates){try{var b=await getJSON('https://api.frankfurter.app/latest?from=JPY');if(b&&b.rates)rates=b.rates}catch(e){}}
  var ok=0;
  if(rates)curs.forEach(function(c){if(rates[c]>0){S.fx[c]={rate:Math.round(1/rates[c]*1000)/1000,at:today(),src:'auto'};ok++}});
  return {n:curs.length,ok:ok};
}
async function fetchStocks(){
  var codes=[];
  var C=calc();
  C.held.forEach(function(h){if(h.sec.type==='jp'&&h.sec.auto&&h.sec.code){var k=pk(h.sec);if(codes.indexOf(k)<0)codes.push(k)}});
  C.M.forEach(function(x){if(x.m.auto!==false){var k=mk_(x.m);if(codes.indexOf(k)<0)codes.push(k)}});
  var ok=0,fail=[];
  for(var i=0;i<codes.length;i++){
    var q=await quoteJP(codes[i]);
    if(q){S.prices[codes[i]]={p:q.p,at:today(),src:'auto'};ok++;
      S.secs.forEach(function(s){if(pk(s)===codes[i]&&(!s.name||s.name===s.code)&&q.name)s.name=q.name});
      S.margins.forEach(function(m){if(mk_(m)===codes[i]&&!m.name&&q.name)m.name=q.name});
    }else{
      fail.push(codes[i]);
      if(goodProx==null){fail=fail.concat(codes.slice(i+1));break}
    }
  }
  if(codes.length)S.fetchFail=fail;
  return {n:codes.length,ok:ok};
}
function setManual(k,p){S.prices[k]={p:p,at:today(),src:'manual'};S.fetchFail=(S.fetchFail||[]).filter(function(x){return x!==k})}
function priceRows(){
  var C=calc(),rows=[],seen={},lim=ago(7),fail=S.fetchFail||[];
  var add=function(k,label,auto,fund){
    if(seen[k])return;seen[k]=1;
    var p=S.prices[k];
    rows.push({k:k,label:label,p:p,fund:fund,bad:!!auto&&(fail.indexOf(k)>=0||!p||(p.src==='auto'&&p.at<lim))});
  };
  C.held.forEach(function(h){add(pk(h.sec),secName(h.sec),h.sec.type==='jp'&&h.sec.auto,h.sec.type==='fund')});
  C.M.forEach(function(x){add(mk_(x.m),x.m.code+' '+(x.m.name||''),x.m.auto!==false,false)});
  rows.sort(function(a,b){return (b.bad?1:0)-(a.bad?1:0)});
  return rows;
}
function hasData(){return !!(S.secs.length||S.cash.length||S.items.length||S.margins.length)}
function backupDue(){
  if(S.sample||!storageOK||!hasData())return false;
  var st=S.settings,now=Date.now();
  if(st.snooze&&now<st.snooze)return false;
  if(!st.lastBackup)return 'まだ一度もバックアップしていません。データはこのiPhoneの中にしかありません。';
  var d=Math.floor((now-st.lastBackup)/864e5);
  return d>=30?'前回のバックアップから'+d+'日たっています。':false;
}
async function updateAll(quiet){

}

/* ---------- chart ---------- */
function nice(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(recs){
  var W=358,Hh=180,L=54,R=10,T=10,B=24;
  var xs=recs.map(function(r){return +new Date(r.date+'T00:00:00')}),yv=recs.map(function(r){return r.total});
  var lo=Math.min.apply(null,yv),hi=Math.max.apply(null,yv);
  if(lo===hi){var q=Math.abs(lo)*.05||1;lo-=q;hi+=q}
  var step=nice((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var x0=xs[0],x1=xs[xs.length-1];
  var X=function(v){return x1===x0?(L+W-R)/2:L+(v-x0)/(x1-x0)*(W-L-R)};
  var Y=function(v){return T+(hi-v)/(hi-lo)*(Hh-T-B)};
  var lab=function(v){return S.settings.hide?'＊＊':(step>=10000?(v/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万':f0(v))};
  var o='<svg class="ch" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="総資産の推移グラフ">';
  for(var v=lo;v<=hi+step/2;v+=step){
    var y=Y(v).toFixed(1);
    o+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="'+(v===lo?'#5a5444':'#2a2720')+'" stroke-width="1"/>';
    o+='<text x="'+(L-6)+'" y="'+(+y+3.5)+'" fill="#A39C8B" font-size="10" text-anchor="end">'+lab(v)+'</text>';
  }
  var pts=recs.map(function(r,i){return X(xs[i]).toFixed(1)+','+Y(r.total).toFixed(1)});
  if(recs.length>1){
    o+='<polygon points="'+X(x0).toFixed(1)+','+Y(lo).toFixed(1)+' '+pts.join(' ')+' '+X(x1).toFixed(1)+','+Y(lo).toFixed(1)+'" fill="#FFA028" fill-opacity=".12"/>';
    o+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#FFA028" stroke-width="2"/>';
  }
  var long=(x1-x0)>300*864e5,lastX=1e9;
  for(var i=recs.length-1;i>=0;i--){
    var px=X(xs[i]),py=Y(recs[i].total),end=i===recs.length-1;
    if(recs.length<=40||end)o+='<rect x="'+(px-(end?4:2.5)).toFixed(1)+'" y="'+(py-(end?4:2.5)).toFixed(1)+'" width="'+(end?8:5)+'" height="'+(end?8:5)+'" fill="'+(end?'#F3EFE6':'#FFA028')+'"/>';
    if(lastX-px>=50){
      var d=recs[i].date,t=long?d.slice(2,4)+'/'+Number(d.slice(5,7)):md(d);
      o+='<text x="'+px.toFixed(1)+'" y="'+(Hh-6)+'" fill="#A39C8B" font-size="10" text-anchor="'+(end&&recs.length>1?'end':'middle')+'">'+t+'</text>';
      lastX=end&&recs.length>1?px-14:px;
    }
  }
  return o+'</svg>';
}

      if(type==='jp'&&!code)return '銘柄コードを入力してください';
      if(type!=='jp'&&!name)return '銘柄名を入力してください';
      sec=type==='jp'?S.secs.find(function(s){return s.type==='jp'&&String(s.code).toUpperCase()===code&&(s.broker||'')===broker}):null;
      if(!sec){sec={id:uid(),type:type,code:type==='jp'?code:'',name:name||code,broker:broker,unit:type==='fund'?10000:1,auto:type==='jp'};S.secs.push(sec)}
    }else sec=S.secs.find(function(s){return s.id===v['f-sec']});
    if(!sec)return '銘柄を選んでください';
    S.trades.push({id:uid(),secId:sec.id,date:v['f-date']||today(),side:'buy',qty:qty,price:price,fee:fee});
    if(!S.prices[pk(sec)])S.prices[pk(sec)]={p:price,at:today(),src:'manual'};
    ui.tab='sec';ui.secTab='pos';if(sec.auto)setTimeout(function(){updateAll(true)},50);
  },
  sell:function(v){
    var qty=num(v['f-qty']),price=num(v['f-price']),fee=num(v['f-fee']);if(!(fee>=0))fee=0;
    var h=calc().H.find(function(x){return x.sec.id===v['f-sec']});
    if(!h)return '銘柄を選んでください';
    if(!(qty>0))return '数量を入力してください';if(qty>h.qty+1e-9)return '保有数（'+Number(h.qty).toLocaleString('ja-JP')+'）を超えています';
    if(!(price>=0))return '売却単価を入力してください';
    S.trades.push({id:uid(),secId:h.sec.id,date:v['f-date']||today(),side:'sell',qty:qty,price:price,fee:fee});
  },
  trade:function(v){
    var t=S.trades.find(function(x){return x.id===v['f-id']});if(!t)return '取引が見つかりません';
    var qty=num(v['f-qty']),price=num(v['f-price']),fee=num(v['f-fee']);if(!(fee>=0))fee=0;
    if(!(qty>0))return '数量を入力してください';if(!(price>=0))return '単価を入力してください';
    t.side=v['f-side'];t.date=v['f-date']||t.date;t.qty=qty;t.price=price;t.fee=fee;
  },
  sec:function(v){
    var s=S.secs.find(function(x){return x.id===v['f-id']});if(!s)return '銘柄が見つかりません';
    var old=pk(s),name=(v['f-name']||'').trim();if(!name)return '銘柄名を入力してください';
    if(s.type==='jp'){var code=(v['f-code']||'').trim().toUpperCase();if(!code)return '銘柄コードを入力してください';s.code=code;s.auto=!!v['f-auto']}
    s.name=name;s.broker=(v['f-broker']||'').trim();
    var k=pk(s);if(k!==old&&S.prices[old]&&!S.prices[k]){S.prices[k]=S.prices[old]}
    var p=num(v['f-price']);
    if(isFinite(p)&&p>=0&&(!S.prices[k]||S.prices[k].p!==p))setManual(k,p);
  },
  marginNew:function(v){
    var code=(v['f-code']||'').trim().toUpperCase(),qty=num(v['f-qty']),price=num(v['f-price']);
    if(!code)return '銘柄コードを入力してください';if(!(qty>0))return '数量を入力してください';if(!(price>0))return '建単価を入力してください';
    S.margins.push({id:uid(),code:code,name:(v['f-name']||'').trim(),broker:(v['f-broker']||'').trim(),side:v['f-side'],qty:qty,entry:price,date:v['f-date']||today(),auto:true});
    if(!S.prices[code])S.prices[code]={p:price,at:today(),src:'manual'};
    ui.tab='sec';ui.secTab='pos';setTimeout(function(){updateAll(true)},50);
  },
  margin:function(v,sub){
    var m=S.margins.find(function(x){return x.id===v['f-id']});if(!m)return '建玉が見つかりません';
    if(sub==='close'){
      var cp=num(v['f-cprice']);if(!(cp>0))return '決済単価を入力してください';
      m.closed=true;m.closePrice=cp;m.closeDate=v['f-cdate']||today();return;
    }
    var qty=num(v['f-qty']),entry=num(v['f-entry']);
    if(!(qty>0))return '数量を入力してください';if(!(entry>0))return '建単価を入力してください';
    m.qty=qty;m.entry=entry;m.name=(v['f-name']||'').trim();m.broker=(v['f-broker']||'').trim();m.auto=!!v['f-auto'];
    var p=num(v['f-price']),k=mk_(m);
    if(isFinite(p)&&p>=0&&(!S.prices[k]||S.prices[k].p!==p))setManual(k,p);
  },
  div:function(v){
    var name=(v['f-name']||'').trim(),amt=num(v['f-amt']);
    if(!name)return '銘柄名を入力してください';if(!(amt>0))return '受取額を入力してください';
    var d=S.divs.find(function(x){return x.id===v['f-id']});
    if(d){d.name=name;d.amount=amt;d.date=v['f-date']||d.date}else S.divs.push({id:uid(),name:name,date:v['f-date']||today(),amount:amt});
    ui.tab='sec';ui.secTab='div';
  },
  cash:function(v){
    var name=(v['f-name']||'').trim(),amt=num(v['f-amt']),cur=v['f-cur'];
    if(!name)return '口座名を入力してください';if(!isFinite(amt))return '残高を入力してください';
    var c=S.cash.find(function(x){return x.id===v['f-id']});
    if(c){c.name=name;c.cur=cur;c.amount=amt;c.at=today()}else S.cash.push({id:uid(),name:name,cur:cur,amount:amt,at:today()});
    if(cur!=='JPY'){
      var r=num(v['f-rate']);
      if(r>0){if(!S.fx[cur]||S.fx[cur].rate!==r)S.fx[cur]={rate:r,at:today(),src:'manual'}}
      else if(!S.fx[cur])setTimeout(function(){updateAll(true)},50);
    }
  },
  item:function(v){
    var name=(v['f-name']||'').trim(),bp=num(v['f-bprice']),val=num(v['f-value']);
    if(!name)return '品名を入力してください';
    if(!isFinite(bp))bp=0;if(!isFinite(val))val=bp;
    if(val<0||bp<0)return '金額は0以上で入力してください';
    var i=S.items.find(function(x){return x.id===v['f-id']});
    if(i){if(i.value!==val)i.valueAt=today();i.name=name;i.buyDate=v['f-bdate']||'';i.buyPrice=bp;i.value=val;i.memo=(v['f-memo']||'').trim()}
    else S.items.push({id:uid(),name:name,buyDate:v['f-bdate']||'',buyPrice:bp,value:val,valueAt:today(),memo:(v['f-memo']||'').trim()});
  },
  hist:function(v){
    var date=v['f-date'],total=num(v['f-total']);
    if(!date)return '記録日を入力してください';if(date>today())return '未来の日付は記録できません';if(!isFinite(total))return '総資産を入力してください';
    var orig=v['f-orig'];
    if(orig&&orig!==date)S.history=S.history.filter(function(h){return h.date!==orig});
    var r=S.history.find(function(h){return h.date===date});
    if(r){r.total=Math.round(total);r.manual=true}else S.history.push({date:date,total:Math.round(total),manual:true});
    S.history.sort(function(a,b){return a.date<b.date?-1:1});
  },
  stock:function(v){
    var t=today(),ops=[],err=null,C=calc();
    S.cash.forEach(function(c){var k='f-c-'+c.id;if(err||!(k in v))return;var n=num(v[k]);if(!isFinite(n)){err=c.name+' の残高を入力してください';return}ops.push(function(){c.amount=n;c.at=t})});
    fxCurs().forEach(function(cur){var k='f-fx-'+cur;if(err||!(k in v)||String(v[k]).trim()==='')return;var r=num(v[k]);if(!(r>0)){err=cur+' のレートは0より大きい数で入力してください';return}ops.push(function(){if(!S.fx[cur]||S.fx[cur].rate!==r)S.fx[cur]={rate:r,at:t,src:'manual'}})});
    C.held.forEach(function(h){var k='f-p-'+h.sec.id;if(err||!(k in v)||String(v[k]).trim()==='')return;var p=num(v[k]);if(!(p>=0)){err=h.sec.name+' の値を入力してください';return}var key=pk(h.sec);ops.push(function(){var cur=S.prices[key];if(!cur||cur.p!==p)setManual(key,p);else cur.at=t})});
    S.items.forEach(function(i){var k='f-i-'+i.id;if(err||!(k in v))return;var n=num(v[k]);if(!(n>=0)){err=i.name+' の時価は0以上で入力してください';return}ops.push(function(){i.value=n;i.valueAt=t})});
    if(err)return err;
    ops.forEach(function(f){f()});
  },
  bulk:function(v){
    var ops=[],err=null;
    Object.keys(v).forEach(function(name){
      if(err||name.indexOf('f-k-')!==0||String(v[name]).trim()==='')return;
      var k=name.slice(4),p=num(v[name]);
      if(!(p>=0)){err='現在値は0以上の数で入力してください';return}
      ops.push(function(){if(!S.prices[k]||S.prices[k].p!==p)setManual(k,p)});
    });
    if(err)return err;
    ops.forEach(function(f){f()});
  },
  target:function(v){
    var t=num(v['f-target']);if(!isFinite(t))t=0;if(t<0)return '0以上で入力してください';
    S.settings.target=t;
  },
  'import':function(v){
    var o;try{o=JSON.parse(v['f-imp'])}catch(e){return 'バックアップの中身を読み取れません。全文が貼り付けられているか確認してください'}
    if(!o||o.v!==1||!Array.isArray(o.secs)||!Array.isArray(o.cash)||!Array.isArray(o.items))return 'このアプリのバックアップではないようです';
    var b=blank();Object.keys(b).forEach(function(k){if(o[k]!=null)b[k]=o[k]});b.settings=defSet(o.settings);if(!Array.isArray(b.fetchFail))b.fetchFail=[];S=b;
  }
};

/* ---------- actions ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function done(msg){save();closeSheet();render();toast(msg||'保存しました')}
function markBackup(msg){S.settings.lastBackup=Date.now();S.settings.snooze=null;save();render();toast(msg||'バックアップを保存しました')}
var acts={
  tab:function(d){ui.tab=d.k;render()},
  secTab:function(d){ui.secTab=d.k;render()},
  range:function(d){ui.range=d.k;render()},
  hide:function(){S.settings.hide=!S.settings.hide;save();render()},
  settings:function(){sheetSettings()},
  update:function(){updateAll(false)},
  close:function(){closeSheet()},
  record:function(d){sheetRecord(d.k||'buy')},
  sec:function(d){sheetSec(d.id)},
  trade:function(d){sheetTrade(d.id)},
  margin:function(d){sheetMargin(d.id)},
  div:function(d){sheetDiv(d.id)},
  cash:function(d){sheetCash(d.id)},
  item:function(d){sheetItem(d.id)},
  hist:function(d){sheetHist(d.id)},
  clearSample:function(){S=blank();ui.msg='';done('サンプルを消しました。自分のデータを入力できます')},
  delSec:function(d){S.secs=S.secs.filter(function(x){return x.id!==d.id});S.trades=S.trades.filter(function(t){return t.secId!==d.id});done('削除しました')},
  delTrade:function(d){S.trades=S.trades.filter(function(x){return x.id!==d.id});done('削除しました')},
  delMargin:function(d){S.margins=S.margins.filter(function(x){return x.id!==d.id});done('削除しました')},
  reopen:function(d){var m=S.margins.find(function(x){return x.id===d.id});if(m){delete m.closed;delete m.closePrice;delete m.closeDate}done('建玉に戻しました')},
  delDiv:function(d){S.divs=S.divs.filter(function(x){return x.id!==d.id});done('削除しました')},
  delCash:function(d){S.cash=S.cash.filter(function(x){return x.id!==d.id});done('削除しました')},
  delItem:function(d){S.items=S.items.filter(function(x){return x.id!==d.id});done('削除しました')},
  delHist:function(d){S.history=S.history.filter(function(x){return x.date!==d.id});done('削除しました')},
  histAuto:function(d){var r=S.history.find(function(x){return x.date===d.id});if(r)delete r.manual;done('自動計算に戻しました')},
  wipe:function(){S=blank();ui.msg='';done('すべて消去しました')},
  'export':function(){
    var txt=JSON.stringify(S),name='shisan-backup-'+today()+'.json';
    var showBox=function(){if(!$('#expbox'))sheetSettings();$('#expbox').hidden=false;$('#f-exp').value=txt};
    if($('#expbox'))showBox();
    try{
      var file=new File([txt],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).then(function(){markBackup()},function(err){if(!err||err.name!=='AbortError'){showBox();toast('共有できませんでした。中身をコピーして保管してください')}});
        return;
      }
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
      showBox();markBackup();
    }catch(e){showBox()}
  },
  copy:function(){
    var ta=$('#f-exp');
    var fb=function(){ta.focus();ta.select();toast('選択しました。コピーを押してください')};
    try{navigator.clipboard.writeText(ta.value).then(function(){markBackup('コピーしました。メモなどに貼り付けて保管してください')},fb)}catch(e){fb()}
  },
  snooze:function(){S.settings.snooze=Date.now()+7*864e5;save();render();toast('7日後にもう一度お知らせします')},
  stock:function(){sheetStock()},
  bulk:function(){sheetBulk()}
};
function armed(el){
  if(!el.dataset.confirm||el.dataset.armed)return true;
  el.dataset.armed='1';el.dataset.label=el.textContent;el.textContent=el.dataset.confirm;
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=el.dataset.label}},4000);
  return false;
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(!armed(el))return;
  var f=acts[el.dataset.a];if(f)f(el.dataset);
});
document.addEventListener('submit',function(e){
  var form=e.target.closest('form[data-f]');if(!form)return;
  e.preventDefault();
  var sb=e.submitter;
  if(sb&&!armed(sb))return;
  var v={};new FormData(form).forEach(function(val,k){if(typeof val==='string')v[k]=val});
  var err=forms[form.dataset.f](v,sb?sb.value:'');
  var box=form.querySelector('.err');
  if(err){if(box){box.textContent=err;box.hidden=false}return}
  done({'import':'バックアップを読み込みました',stock:'棚卸しを保存しました',bulk:'現在値を保存しました'}[form.dataset.f]||'保存しました');
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-sec'&&$('#newsec'))$('#newsec').hidden=t.value!=='__new';
  if(t.id==='f-cur'&&$('#fxbox')){$('#fxbox').hidden=t.value==='JPY';var f=S.fx[t.value];$('#f-rate').value=f?f.rate:''}
  if(t.id==='f-file'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){$('#f-imp').value=String(r.result||'')};r.readAsText(t.files[0])}
});

/* ---------- boot ---------- */
S=load();
save();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
try{if('serviceWorker' in navigator&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
if(!S.lastFetch||Date.now()-S.lastFetch>30*60*1000)setTimeout(function(){
  var C=calc();
  var need=C.held.some(function(h){return h.sec.type==='jp'&&h.sec.auto})||C.M.some(function(x){return x.m.auto!==false})||S.cash.some(function(c){return c.cur!=='JPY'&&!S.sample});
  if(need)updateAll(true);
},400);
document.addEventListener('visibilitychange',function(){if(!document.hidden){save();render()}});
})();
</script>
</body>
</html>
