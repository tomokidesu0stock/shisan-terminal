<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* layout: one-screen terminal. amber title bar, scrolling ledger, five function-key tabs at the bottom */
:root{--bg:#000000;--panel:#0d0c09;--bar:#211e17;--line:#38342a;--amber:#FFA028;--fg:#F3EFE6;--dim:#A39C8B;--up:#35D07F;--dn:#FF6B5E;--cy:#5BC8F5;--gry:#8C8676;--ink:#000000;--mono:'IBM Plex Mono','IBM Plex Sans JP',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:4px 4px 4px 16px;background:var(--amber);color:var(--ink)}
header h1{margin:0;min-width:0;font-size:14px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;gap:4px;flex:none}
.hb button{min-height:44px;padding:0 12px;border:0;background:var(--ink);color:var(--amber);font-size:12px;white-space:nowrap}
.hb button:disabled{opacity:.6}
#ban{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 16px;background:var(--bar);color:var(--cy);font-size:12px}
#ban button{min-height:44px;padding:0 12px;border:1px solid var(--cy);background:var(--bg);color:var(--cy);font-size:12px;white-space:nowrap}
.subt{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1px solid var(--line)}
.subt button{min-height:44px;padding:0 2px;border:0;border-bottom:3px solid transparent;background:none;color:var(--dim);font-size:13px}
.subt button[aria-pressed=true]{border-bottom-color:var(--amber);color:var(--amber);font-weight:700}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 0;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
.lb{font-size:11px;color:var(--dim);letter-spacing:.08em}
.big{font-size:min(40px,calc((min(100vw,560px) - 34px) / (var(--n,10) * .62)));font-weight:700;line-height:1.1;white-space:nowrap}
.mid{font-size:min(28px,calc((min(100vw,560px) - 34px) / (var(--n,10) * .62)));font-weight:700;line-height:1.1;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}.am{color:var(--amber)}.cy{color:var(--cy)}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.col.e{align-items:flex-end;text-align:right;margin-left:auto}
.row2{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:4px 12px}
.box{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.box.warn{border-color:var(--dn);color:var(--dn);font-size:12px}
.box.att{border-color:var(--amber)}
.box.att p{margin:0;font-size:13px}
.btnrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fl .am{color:var(--amber)}
.meter{height:10px;background:var(--bar)}
.meter i{display:block;height:100%;background:var(--amber)}
.alloc{display:flex;height:14px;gap:2px}
.alloc i{display:block;min-width:2px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px 8px;align-items:center}
.kv4{display:grid;grid-template-columns:14px minmax(0,1fr) auto minmax(56px,auto);gap:10px 8px;align-items:center}
.sw{width:10px;height:10px}
.r{text-align:right}
.gh{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;background:var(--bar);font-size:12px}
.gh.hot{background:var(--amber);color:var(--ink);font-weight:700}
.gh span{min-width:0;overflow-wrap:anywhere}
.gh.c3{display:grid;grid-template-columns:minmax(5em,1fr) auto auto;column-gap:8px}
.it.c3.h,.gh.c3.h{grid-template-columns:88px minmax(0,1fr) minmax(0,1fr)}
.nw{white-space:nowrap}
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(5em,1fr) auto auto;column-gap:12px;row-gap:2px;align-items:baseline;width:100%;min-height:48px;padding:8px;border:0;border-bottom:1px solid var(--bar);background:none;text-align:left}
.it.c3{grid-template-columns:minmax(5em,1fr) auto auto;column-gap:8px}
.it.c3 .r{font-size:11px;letter-spacing:-.02em}
.it .r,.it .pl{overflow-wrap:anywhere}
.it .n{overflow-wrap:anywhere}
.it .s{grid-column:1/-1;font-size:11px;color:var(--dim)}
.it .s.am{color:var(--amber)}
.it .pl{min-width:80px;text-align:right}
.tag{display:inline-block;min-width:34px;margin-right:6px;padding:0 4px;border:1px solid currentColor;font-size:11px;text-align:center}
.note{font-size:11px;color:var(--dim)}
.empty{padding:24px 8px;border:1px dashed var(--line);color:var(--dim);font-size:13px;text-align:center}
@media (max-height:500px){.add{position:static!important}}
.add{position:sticky;bottom:0;margin-top:auto;padding:14px 0 12px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
.btn{display:block;width:100%;min-height:48px;padding:0 10px;border:1px solid var(--amber);background:var(--bg);color:var(--amber);font-weight:700}
.btn.pri{background:var(--amber);color:var(--ink)}
.btn.dgr{border-color:var(--dn);color:var(--dn)}
.btn.sec{border-color:var(--line);color:var(--fg);font-weight:400}
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);background:var(--panel)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0;border:0;background:none;color:var(--dim);font-size:12px;white-space:nowrap}
nav button small{font-size:10px}
nav button[aria-current=page]{background:var(--amber);color:var(--ink);font-weight:700}
svg.ch{display:block;width:100%;height:auto}
#sheet{position:fixed;inset:0;z-index:10;background:var(--panel)}
#sheet .pn{height:100%;max-width:560px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh span{min-width:0;overflow-wrap:anywhere}
.sh button{flex:none}
.sh{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 16px;background:var(--amber);color:var(--ink);font-weight:700;letter-spacing:.06em}
.sh button{min-height:44px;padding:0 14px;border:0;background:var(--ink);color:var(--amber);font-size:12px;font-weight:400}
.sb{padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.sb h2{margin:8px 0 0;font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.08em}
form{display:flex;flex-direction:column;gap:12px;margin:0}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--dim)}
.fl>span{overflow-wrap:anywhere}
.hidemode .fl input[inputmode=decimal]:not(:focus){color:transparent;text-shadow:0 0 9px var(--fg)}
#main:focus{outline:none}
.fl input,.fl select,.fl textarea{width:100%;min-height:46px;padding:8px 10px;border:1px solid #6b6455;border-radius:0;background:var(--bg);color:var(--fg);font-size:16px}
.fl textarea{min-height:110px;font-size:12px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--fg);font-size:13px}
.ck input{width:22px;height:22px;accent-color:var(--amber)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{margin:0;color:var(--dn);font-size:12px}
#toast{pointer-events:none;position:fixed;left:16px;right:16px;top:calc(60px + env(safe-area-inset-top,0px));z-index:20;max-width:528px;margin:0 auto;padding:10px 12px;background:var(--fg);color:var(--ink);font-size:13px;text-align:center}
</style>
<div id="app">
<header><h1 id="ttl">資産ターミナル</h1><div class="hb" id="hb"></div></header>
<div id="ban" hidden><span>サンプルデータを表示中</span><button type="button" data-a="clearSample" data-confirm="もう一度押すと消去">消して始める</button></div>
<div id="sub" class="subt" hidden></div>
<main id="main" tabindex="-1"></main>
<nav id="nav" aria-label="画面切り替え"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
(function(){
'use strict';
var KEY='asset-terminal-v1';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return ymd(new Date())};
var ago=function(n){var d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
var num=function(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  var s=String(v==null?'':v).replace(/[０-９．－＋]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).replace(/−/g,'-').replace(/，/g,',').trim();
  if(/[\d,.]\s+[\d,.]/.test(s))return NaN;
  s=s.replace(/[\s¥￥円]/g,'');
  if(s==='')return NaN;
  if(s.indexOf(',')>=0){
    var segs=s.replace(/^[+-]/,'').split(/[億万]/);
    for(var si=0;si<segs.length;si++){if(segs[si].indexOf(',')>=0&&!/^[1-9]\d{0,2}(,\d{3})+(\.\d+)?$/.test(segs[si]))return NaN}
    s=s.replace(/,/g,'');
  }
  var neg=false;if(/^[+-]/.test(s)){neg=s.charAt(0)==='-';s=s.slice(1)}
  var n;
  if(/[億万]/.test(s)){
    var m=s.match(/^(?:(\d+(?:\.\d+)?)億)?(?:(\d+(?:\.\d+)?)万)?(\d+(?:\.\d+)?)?$/);
    if(!m||!(m[1]||m[2]||m[3]))return NaN;
    if(m[3]&&(m[1]||m[2])&&m[3].split('.')[0].length!==(m[2]?4:8))return NaN;
    n=(m[1]?Number(m[1])*1e8:0)+(m[2]?Number(m[2])*1e4:0)+(m[3]?Number(m[3]):0);
  }else{
    if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
    n=Number(s);
  }
  return isFinite(n)&&n<=1e15?(neg?-n:n):NaN;
};
var blankStr=function(x){return String(x==null?'':x).trim()===''};
var HID='＊＊＊＊';
var S,storageOK=true,busy=false;
var ui={tab:'sum',secTab:'pos',range:'6m',kind:'buy',msg:'',gen:0};

/* ---------- formatting ---------- */
var f0=function(n){return (Math.round(n)+0).toLocaleString('ja-JP')};
var fr=function(n){return Number(n).toLocaleString('ja-JP',{maximumSignificantDigits:6})};
var fx2=function(n){return Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2})};
var yen=function(n){return S.settings.hide?HID:f0(n)};
var sgn=function(n){n=Math.round(n);return S.settings.hide?HID:(n>0?'+':n<0?'-':'')+f0(Math.abs(n))};
var pct=function(n){if(!isFinite(n))return '—';if(Math.abs(n)<0.05)return '0.0%';return (n>0?'+':'-')+Math.abs(n).toFixed(1)+'%'};
var cls=function(n){n=Math.round(n);return n>0?'up':n<0?'dn':'dim'};
var arrow=function(n){n=Math.round(n);return n>0?'▲ ':n<0?'▼ ':''};
var pr=function(n){return S.settings.hide?HID:fx2(n)};
var qf=function(n){return S.settings.hide?HID:Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4})};
var md=function(s){return s?Number(s.slice(5,7))+'/'+Number(s.slice(8,10)):''};
var ys=function(s){return s?s.replace(/-/g,'/'):''};
var stamp=function(ms){if(!ms)return '未取得';var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ---------- state ---------- */
function defSet(o){return Object.assign({target:0,hide:false,lastBackup:null,snooze:null},o||{})}
function blank(){return {v:1,sample:false,settings:defSet(),funds:[],cash:[],fx:{},items:[],debts:[],history:[],lastFetch:null}}
function sample(){
  var s=blank(),t=today(),y=new Date().getFullYear();
  s.sample=true;s.settings.target=20000000;
  var fa={id:uid(),name:'A証券',ev:[]},fb={id:uid(),name:'B証券',ev:[]};s.funds.push(fa,fb);
  [['in',ago(700),5000000,0],['aum',ago(500),0,5450000],['in',ago(360),1000000,5600000],['aum',ago(200),0,6300000],['out',ago(90),300000,6700000],['aum',ago(3),0,7100000]].forEach(function(a){
    fa.ev.push({id:uid(),date:a[1],kind:a[0],amount:a[2],aum:a[3]});
  });
  [['in',ago(400),2000000,0],['aum',ago(150),0,2180000],['aum',ago(5),0,2350000]].forEach(function(a){
    fb.ev.push({id:uid(),date:a[1],kind:a[0],amount:a[2],aum:a[3]});
  });
  [['A銀行 普通','JPY',2000000,3],['B銀行 定期','JPY',1500000,13],['財布・手元現金','JPY',50000,0],['電子マネー','JPY',30000,0],['C銀行 外貨普通','USD',6000,5],['手元の外貨','EUR',125,30]].forEach(function(a){
    s.cash.push({id:uid(),name:a[0],cur:a[1],amount:a[2],at:ago(a[3])});
  });
  s.fx={USD:{rate:150,at:t,src:'manual'},EUR:{rate:160,at:t,src:'manual'}};
  [['腕時計',1400,300000,280000,42],['ノートPC',950,250000,150000,12],['カメラ',1150,180000,120000,59],['自転車',520,120000,95678,217]].forEach(function(a){
    s.items.push({id:uid(),name:a[0],buyDate:ago(a[1]),buyPrice:a[2],value:a[3],valueAt:ago(a[4]),memo:''});
  });
  [['自動車ローン',1200000,6],['クレジットカード',85000,2]].forEach(function(a){s.debts.push({id:uid(),name:a[0],amount:a[1],at:ago(a[2])})});
  var now=new Date(),tot=[12200000,12470000,12830000,12700000,13287222];
  for(var i=5;i>=1;i--){s.history.push({date:ymd(new Date(now.getFullYear(),now.getMonth()-i+1,0)),total:tot[5-i]})}
  return s;
}
var DRE=/^\d{4}-\d{2}-\d{2}$/;
function validD(x){if(typeof x!=='string'||!DRE.test(x))return false;var d=new Date(x+'T00:00:00');return !isNaN(d)&&ymd(d)===x}
function arr(x){return Array.isArray(x)?x.filter(function(e){return e&&typeof e==='object'}):[]}
function obj(x){return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
function safeId(x){return typeof x==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(x)}
function dt(x,def,lo){return validD(x)&&x>=(lo||'1950-01-01')&&x<=ago(-1)?x:def}
function nz(x){x=typeof x==='string'?num(x):Number(x);return isFinite(x)&&Math.abs(x)<=1e15?x:0}
function ts(x,maxAhead){x=nz(x);return x>0&&x<=Date.now()+(maxAhead||864e5)?x:null}
function uniq(){var seen=Object.create(null);return function(id){if(safeId(id)&&!seen[id]){seen[id]=1;return id}var n=uid();seen[n]=1;return n}}
function normalize(o){
  if(!o||typeof o!=='object'||Number(o.v)!==1||!Array.isArray(o.cash)||!Array.isArray(o.items))return null;
  var b=blank(),t=today();
  b.sample=!!o.sample;b.sampleEdited=!!o.sampleEdited;
  var st=defSet(obj(o.settings));
  b.settings={target:Math.max(0,nz(st.target)),hide:st.hide===true||st.hide==='true'||st.hide===1,lastBackup:ts(st.lastBackup),snooze:ts(st.snooze,8*864e5)};
  var U=uniq();
  var normEv=function(evs){return arr(evs).map(function(e){
    var kind=['aum','in','out'].indexOf(e.kind)>=0?e.kind:null;
    return kind?{id:U(e.id),date:dt(e.date,t),kind:kind,amount:kind==='aum'?0:Math.max(0,nz(e.amount)),aum:Math.max(0,nz(e.aum))}:null;
  }).filter(function(e){return e&&(e.kind==='aum'||e.amount>0)})};
  var fl=Array.isArray(o.funds)?arr(o.funds):[],names={};
  if(!Array.isArray(o.funds)){var fo=obj(o.fund);if(arr(fo.ev).length)fl=[{name:fo.name||'証券会社1',ev:fo.ev}]}
  b.funds=fl.map(function(f,i){
    var nm=String(f.name==null?'':f.name).trim().slice(0,40)||'証券会社'+(i+1),base=nm,k=2;
    while(names[nm])nm=base+' ('+(k++)+')';names[nm]=1;
    return {id:U(f.id),name:nm,ev:normEv(f.ev)};
  });
  b.cash=arr(o.cash).map(function(c){var cur=String(c.cur||'JPY').toUpperCase();return {id:U(c.id),name:String(c.name||''),cur:/^[A-Z]{3}$/.test(cur)?cur:'JPY',amount:nz(c.amount),at:dt(c.at,t)}});
  b.items=arr(o.items).map(function(i){return {id:U(i.id),name:String(i.name||''),buyDate:dt(i.buyDate,'','1900-01-01'),buyPrice:nz(i.buyPrice),value:nz(i.value),valueAt:dt(i.valueAt,t),memo:String(i.memo||'')}});
  b.debts=arr(o.debts).map(function(d){return {id:U(d.id),name:String(d.name||''),amount:Math.max(0,nz(d.amount)),at:dt(d.at,t)}});
  var seen={};
  b.history=arr(o.history).filter(function(h){if(dt(h.date,null)==null||h.date>t||seen[h.date])return false;seen[h.date]=1;return true})
    .map(function(h){var r={date:h.date,total:Math.round(nz(h.total))};if(h.manual)r.manual=true;return r})
    .sort(function(a,c){return a.date<c.date?-1:1});
  var fx=obj(o.fx);Object.keys(fx).forEach(function(k0){var f=fx[k0],k=k0.toUpperCase();if(/^[A-Z]{3}$/.test(k)&&f&&nz(f.rate)>0)b.fx[k]={rate:nz(f.rate),at:dt(f.at,t),src:f.src==='auto'?'auto':'manual'}});
  b.lastFetch=ts(o.lastFetch);b.savedAt=nz(o.savedAt)||0;
  b.noRecord=validD(o.noRecord)?o.noRecord:null;
  return b;
}
function rescuePending(){try{return !!localStorage.getItem(KEY+'-rescue')&&localStorage.getItem(KEY+'-rack')!=='1'}catch(e){return false}}
function rescueAck(){try{localStorage.setItem(KEY+'-rack','1')}catch(e){}}
function rescueText(){try{return localStorage.getItem(KEY+'-rescue')}catch(e){return null}}
function load(){
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){storageOK=false}
  var t=null;try{t=localStorage.getItem(KEY)}catch(e){}
  if(t){
    var o=null;try{o=normalize(JSON.parse(t))}catch(e){}
    if(o){ui.loaded=true;return o}
    try{var old=localStorage.getItem(KEY+'-rescue');if(old&&old!==t)localStorage.setItem(KEY+'-rescue-'+Date.now(),old);localStorage.setItem(KEY+'-rescue',t);localStorage.removeItem(KEY+'-rack')}catch(e){ui.noSave=true}
    ui.loadError=true;
    return blank();
  }
  return sample();
}
var lastSnap=null;
function snapOf(){var t=S.savedAt;S.savedAt=0;var j=JSON.stringify(S);S.savedAt=t;return j}
function save(){
  recordToday();
  if(ui.noSave)return false;
  var sn=snapOf();
  if(sn===lastSnap&&storageOK)return true;
  var prev=S.savedAt;S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;lastSnap=sn;return true}catch(e){S.savedAt=prev;storageOK=false;return false}
}

/* ---------- calculations ---------- */
function calc(){
  var sum=function(a,f){return a.reduce(function(x,y){return x+f(y)},0)};
  var cash=S.cash.map(function(c){var rate=c.cur==='JPY'?1:(S.fx[c.cur]?S.fx[c.cur].rate:null);return {c:c,rate:rate,jpy:rate==null?0:c.amount*rate}});
  var FS=S.funds.map(function(f){return {f:f,F:fundCalc(f.ev)}});
  var C={cash:cash,FS:FS,F:{aum:sum(FS,function(x){return x.F.aum}),net:sum(FS,function(x){return x.F.net}),inv:sum(FS,function(x){return x.F.inv}),red:sum(FS,function(x){return x.F.red})}};
  C.secTotal=C.F.aum;
  C.cashVal=sum(cash,function(x){return x.jpy});
  C.itemsVal=sum(S.items,function(i){return i.value||0});C.itemsCost=sum(S.items,function(i){return i.buyPrice||0});
  C.assets=C.secTotal+C.cashVal+C.itemsVal;
  C.debtVal=sum(S.debts,function(d){return d.amount||0});
  C.total=C.assets-C.debtVal;
  return C;
}
/* ファンド計算：出資・払い戻しのたびに、その直前の評価額で基準価額を決めて口数を発行・解約する（1口=1円で設定、表示は1万口あたり） */
function fundCalc(evs){
  var units=0,aum=0,inv=0,red=0,err=null,lastNav=1,pts=[],start=null,last=null;
  sortTrades(evs).forEach(function(e){
    if(err)return;
    if(e.kind==='aum'){
      if(units<=0){err=ys(e.date)+' 時点では出資がないため、評価額を記録できません';return}
      aum=e.aum;lastNav=aum/units;
    }else{
      var before=units>0?e.aum:0;
      if(units>0&&!(before>0)){err=ys(e.date)+' の'+(e.kind==='in'?'出資':'払い戻し')+'前の評価額が0のため、基準価額を計算できません';return}
      var nav=units>0?before/units:lastNav;
      if(e.kind==='in'){units+=e.amount/nav;inv+=e.amount;aum=before+e.amount;if(!start)start=e.date}
      else{
        if(units<=0){err=ys(e.date)+' 時点では出資がないため、払い戻しできません';return}
        if(e.amount>before+0.5){err=ys(e.date)+' の払い戻し額が、その時点の評価額（'+f0(before)+'円）を超えています';return}
        units-=e.amount/nav;red+=e.amount;aum=before-e.amount;if(units<1e-9||aum<0.5){units=0;aum=0}
      }
      lastNav=nav;
    }
    last=e.date;pts.push({date:e.date,nav:lastNav});
  });
  var yr=new Date().getFullYear()+'-01-01',ref=null;pts.forEach(function(p){if(p.date<yr)ref=p});
  return {err:err,units:units,aum:aum,inv:inv,red:red,net:inv-red,nav:lastNav,start:start,last:last,since:(lastNav-1)*100,ytd:pts.length?(lastNav/(ref||pts[0]).nav-1)*100:0,ytdLabel:ref?'年初来':'設定来'};
}
function fundCheck(evs){return fundCalc(evs).err}
function sortTrades(list){return list.map(function(t,i){return [t,i]}).sort(function(a,b){return a[0].date<b[0].date?-1:a[0].date>b[0].date?1:a[1]-b[1]}).map(function(x){return x[0]})}
function recordToday(){
  var t=today(),idx=-1;
  S.history.forEach(function(h,i){if(h.date===t)idx=i});
  if(!hasData()){if(idx>=0&&!S.history[idx].manual)S.history.splice(idx,1);return}
  if(S.noRecord===t)return;
  var total=Math.round(calc().total);if(!isFinite(total))return;
  if(idx>=0){if(!S.history[idx].manual)S.history[idx].total=total}
  else{S.history.push({date:t,total:total});S.history.sort(function(a,b){return a.date<b.date?-1:1})}
}
function prevLabel(r){var d=new Date();return r.date===ymd(new Date(d.getFullYear(),d.getMonth(),0))?'前月末比':ys(r.date)+'比'}
function prevMonthRec(){
  var d=new Date(),first=ymd(new Date(d.getFullYear(),d.getMonth(),1)),r=null;
  S.history.forEach(function(h){if(h.date<first)r=h});return r;
}

/* ---------- price / fx fetch ---------- */
function getText(url,ms){
  var c=new AbortController(),t=setTimeout(function(){c.abort()},ms||6000);
  return fetch(url,{signal:c.signal,cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).finally(function(){clearTimeout(t)});
}
function getJSON(url,ms){return getText(url,ms).then(function(t){return JSON.parse(t)})}
async function fetchFX(g0){
  var g=g0==null?ui.gen:g0,curs=[];S.cash.forEach(function(c){if(c.cur!=='JPY'&&curs.indexOf(c.cur)<0)curs.push(c.cur)});
  if(!curs.length)return {n:0,ok:0};
  var rates=null;
  try{var a=await getJSON('https://open.er-api.com/v6/latest/JPY');if(a&&a.rates)rates=a.rates}catch(e){}
  if(!rates){try{var b=await getJSON('https://api.frankfurter.app/latest?from=JPY');if(b&&b.rates)rates=b.rates}catch(e){}}
  var ok=0;
  if(g!==ui.gen)return {n:0,ok:0,stale:true};
  if(rates&&curs.some(function(c){return !(rates[c]>0)})){try{var b2=await getJSON('https://api.frankfurter.app/latest?from=JPY');if(b2&&b2.rates)Object.keys(b2.rates).forEach(function(c){if(!(rates[c]>0))rates[c]=b2.rates[c]})}catch(e){}}
  if(g!==ui.gen)return {n:0,ok:0,stale:true};
  if(rates)curs.forEach(function(c){if(rates[c]>0){S.fx[c]={rate:Number((1/rates[c]).toPrecision(6)),at:today(),src:'auto'};ok++}});
  return {n:curs.length,ok:ok};
}
function hasData(){return !!(S.funds.length||S.cash.length||S.items.length||S.debts.length)}
function backupDue(){
  if((S.sample&&!S.sampleEdited)||!storageOK||!hasData())return false;
  var st=S.settings,now=Date.now();
  if(st.snooze&&now<st.snooze)return false;
  if(!st.lastBackup)return 'まだ一度もバックアップしていません。データはこのiPhoneの中にしかありません。';
  var d=Math.floor((now-st.lastBackup)/864e5);
  return d>=30?'前回のバックアップから'+d+'日たっています。':false;
}
async function updateAll(quiet){
  if(busy){ui.again=true;return}busy=true;render();
  var g=ui.gen,b={n:0,ok:0};
  try{b=await fetchFX(g)}catch(e){}
  busy=false;
  if(g!==ui.gen||b.stale){render();if(ui.again){ui.again=false;setTimeout(function(){updateAll(true)},50)}return}
  if(b.ok)S.lastFetch=Date.now();
  ui.msg=b.n?'為替 '+b.ok+'/'+b.n+'件 取得'+(b.ok<b.n?'（取れなかった分は手入力できます）':''):'';
  save();render();
  if(!quiet)toast(b.n?ui.msg:'自動取得の対象がありません');
  if(ui.again){ui.again=false;setTimeout(function(){updateAll(true)},50)}
}

/* ---------- chart ---------- */
function nice(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(recs){
  var W=358,Hh=180,L=54,R=10,T=10,B=24;
  var xs=recs.map(function(r){return +new Date(r.date+'T00:00:00')}),yv=recs.map(function(r){return r.total});
  var lo=Math.min.apply(null,yv),hi=Math.max.apply(null,yv);
  var minR=Math.max(Math.abs(hi)*0.004,Math.abs(lo)*0.004,3);
  if(hi-lo<minR){var mid=(hi+lo)/2;lo=mid-minR/2;hi=mid+minR/2}
  var step=nice((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var x0=xs[0],x1=xs[xs.length-1];
  var X=function(v){return x1===x0?(L+W-R)/2:L+(v-x0)/(x1-x0)*(W-L-R)};
  var Y=function(v){return T+(hi-v)/(hi-lo)*(Hh-T-B)};
  var lab=function(v){
    if(S.settings.hide)return '＊＊';
    var a=Math.abs(v),u=a>=1e12?1e12:a>=1e8?1e8:a>=1e4?1e4:1;
    if(u===1)return f0(v);
    var dec=Math.max(0,Math.min(4,Math.ceil(-Math.log10(step/u)-1e-9)));
    return (v/u).toLocaleString('ja-JP',{maximumFractionDigits:dec})+{1e12:'兆',1e8:'億',1e4:'万'}[u];
  };
  var o='<svg class="ch" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="純資産の推移グラフ">';
  for(var v=lo;v<=hi+step/2;v+=step){
    var y=Y(v).toFixed(1);
    o+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="'+(v===lo?'#5a5444':'#2a2720')+'" stroke-width="1"/>';
    o+='<text x="'+(L-6)+'" y="'+(+y+3.5)+'" fill="#A39C8B" font-size="10" text-anchor="end">'+lab(v)+'</text>';
  }
  var pts=recs.map(function(r,i){return X(xs[i]).toFixed(1)+','+Y(r.total).toFixed(1)});
  if(recs.length>1){
    o+='<polygon points="'+X(x0).toFixed(1)+','+Y(lo).toFixed(1)+' '+pts.join(' ')+' '+X(x1).toFixed(1)+','+Y(lo).toFixed(1)+'" fill="#FFA028" fill-opacity=".12"/>';
    o+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#FFA028" stroke-width="2"/>';
  }
  var long=(x1-x0)>300*864e5,lastX=1e9;
  for(var i=recs.length-1;i>=0;i--){
    var px=X(xs[i]),py=Y(recs[i].total),end=i===recs.length-1;
    if(recs.length<=40||end)o+='<rect x="'+(px-(end?4:2.5)).toFixed(1)+'" y="'+(py-(end?4:2.5)).toFixed(1)+'" width="'+(end?8:5)+'" height="'+(end?8:5)+'" fill="'+(end?'#F3EFE6':'#FFA028')+'"/>';
    if(lastX-px>=50){
      var d=recs[i].date,t=long?d.slice(2,4)+'/'+Number(d.slice(5,7)):md(d);
      o+='<text x="'+px.toFixed(1)+'" y="'+(Hh-6)+'" fill="#A39C8B" font-size="10" text-anchor="'+(end&&recs.length>1?'end':'middle')+'">'+t+'</text>';
      lastX=end&&recs.length>1?px-14:px;
    }
  }
  return o+'</svg>';
}

/* 評価額の記録：同じ日の最後の記録が評価額ならそれを書き換え、そうでなければ追加 */
function withAum(evs,date,a){
  var same=evs.filter(function(x){return x.date===date}),lastE=same[same.length-1];
  if(lastE&&lastE.kind==='aum')return evs.map(function(x){return x===lastE?Object.assign({},x,{aum:a}):x});
  return evs.concat([{id:uid(),date:date,kind:'aum',amount:0,aum:a}]);
}
var forms={
  fund:function(v){
    var fd=S.funds.find(function(f){return f.id===v['f-fund']});if(!fd)return '証券会社が見つかりません';
    var kind=v['f-kind'],e=v['f-id']?fundEvOf(fd,v['f-id']):null,date=v['f-date']||today();
    if(v['f-id']&&!e)return '記録が見つかりません';
    if(['aum','in','out'].indexOf(kind)<0)return '種類を選んでください';
    var a=num(v['f-aum']),amt=0;
    if(kind!=='aum'){amt=num(v['f-amt']);if(!(amt>0))return bad(v,'f-amt',kind==='in'?'出資額':'払い戻し額')}
    if(kind==='aum'||v['f-show']==='1'){if(!(a>=0))return bad(v,'f-aum','評価額',1)}else a=0;
    var list;
    if(e){var ne=Object.assign({},e,{date:date,aum:a,amount:amt});list=fd.ev.map(function(x){return x===e?ne:x})}
    else list=kind==='aum'?withAum(fd.ev,date,a):fd.ev.concat([{id:uid(),date:date,kind:kind,amount:amt,aum:a}]);
    var err=fundCheck(list);if(err)return err;
    fd.ev=list;ui.tab='sec';ui.fund=fd.id;
  },
  fundInit:function(v){
    var name=(v['f-name']||'').trim().slice(0,40),date=v['f-date']||today(),amt=num(v['f-amt']),now=blankStr(v['f-now'])?amt:num(v['f-now']);
    if(!name)return '証券会社名を入力してください';
    if(S.funds.some(function(f){return f.name===name}))return name+' はすでにあります';
    if(!(amt>0))return bad(v,'f-amt','最初の出資額');
    if(!(now>=0))return bad(v,'f-now','今の評価額',1);
    var list=[{id:uid(),date:date,kind:'in',amount:amt,aum:0}];
    if(date<today()||now!==amt)list.push({id:uid(),date:today(),kind:'aum',amount:0,aum:now});
    var err=fundCheck(list);if(err)return err;
    S.funds.push({id:uid(),name:name,ev:list});ui.tab='sec';ui.fund=null;
  },
  fname:function(v){
    var fd=S.funds.find(function(f){return f.id===v['f-fund']});if(!fd)return '証券会社が見つかりません';
    var name=(v['f-name']||'').trim().slice(0,40);if(!name)return '証券会社名を入力してください';
    if(S.funds.some(function(f){return f!==fd&&f.name===name}))return name+' はすでにあります';

  },
  aumAll:function(v){

      var a=num(v[k]);if(!(a>=0)){err=fd.name+' の評価額は0以上の数字で入力してください';return}
      var L=withAum(fd.ev,date,a),e2=fundCheck(L);if(e2){err=fd.name+'：'+e2;return}ops.push(function(){fd.ev=L})});
    if(err)return err;ops.forEach(function(f){f()});
  },
  debt:function(v){

    if(!name)return '借入先・名前を入力してください';
    if(!(amt>=0))return bad(v,'f-amt','残高',1);

    if(d){d.name=name;if(d.amount!==amt)d.at=today();d.amount=amt}else S.debts.push({id:uid(),name:name,amount:amt,at:today()});

    if(!/^[A-Z]{3}$/.test(cur))return '通貨を選んでください';
    var r=null;
    if(cur!=='JPY'&&!blankStr(v['f-rate'])){r=num(v['f-rate']);if(!(r>0))return '為替レートは0より大きい数字で入力してください（例 150.25）。空欄なら自動取得します'}
    var c=S.cash.find(function(x){return x.id===v['f-id']});
    if(c){c.name=name;c.cur=cur;c.amount=amt;c.at=today()}else S.cash.push({id:uid(),name:name,cur:cur,amount:amt,at:today()});
    if(cur!=='JPY'){
      if(r!=null&&(changed(v,'f-rate')||!S.fx[cur])){if(!S.fx[cur]||S.fx[cur].rate!==r)S.fx[cur]={rate:r,at:today(),src:'manual'}}
      else if(!S.fx[cur])setTimeout(function(){updateAll(true)},50);
    }
  },
  item:function(v){
    var name=(v['f-name']||'').trim(),bp=blankStr(v['f-bprice'])?0:num(v['f-bprice']),val=num(v['f-value']);
    var i=S.items.find(function(x){return x.id===v['f-id']});
    if(!name)return '品名を入力してください';
    if(!isFinite(bp))return '購入額を数字で入力してください（例 150000、15万）';
    if(blankStr(v['f-value'])){if(i)return '時価を入力してください';val=bp}
    else if(!isFinite(val))return '時価を数字で入力してください（例 120000、12万）';
    if(val<0||bp<0)return '金額は0以上で入力してください';
    if(i){if(i.value!==val)i.valueAt=today();i.name=name;i.buyDate=v['f-bdate']||'';i.buyPrice=bp;i.value=val;i.memo=(v['f-memo']||'').trim()}
    else S.items.push({id:uid(),name:name,buyDate:v['f-bdate']||'',buyPrice:bp,value:val,valueAt:today(),memo:(v['f-memo']||'').trim()});
  },
  hist:function(v){
    var date=v['f-date'],total=num(v['f-total']);
    if(!date)return '記録日を入力してください';if(date>today())return '未来の日付は記録できません';if(!isFinite(total))return blankStr(v['f-total'])?'純資産を入力してください':'純資産は数字で入力してください（例 12,000,000、1200万。マイナスも可）';
    var orig=v['f-orig'];
    if(orig!==date&&S.history.some(function(h){return h.date===date}))return ys(date)+' の記録はすでにあります。一覧からその記録をタップして修正してください';
    if(orig&&orig!==date){S.history=S.history.filter(function(h){return h.date!==orig});if(orig===today())S.noRecord=today()}
    if(date===today())S.noRecord=null;
    var r=S.history.find(function(h){return h.date===date});
    if(r){if(orig!==date||changed(v,'f-total')||Math.round(total)!==r.total){r.total=Math.round(total);r.manual=true}}else S.history.push({date:date,total:Math.round(total),manual:true});
    S.history.sort(function(a,b){return a.date<b.date?-1:1});
  },
  stock:function(v){
    var t=today(),ops=[],err=null,C=calc();
    S.cash.forEach(function(c){var k='f-c-'+c.id;if(err||!(k in v))return;var n=num(v[k]);if(!isFinite(n)){err=c.name+' の残高を数字で入力してください';return}ops.push(function(){c.amount=n;c.at=t})});
    fxCurs().forEach(function(cur){var k='f-fx-'+cur;if(err||!(k in v)||blankStr(v[k])||!changed(v,k))return;var r=num(v[k]);if(!(r>0)){err=cur+' のレートは0より大きい数で入力してください';return}ops.push(function(){S.fx[cur]={rate:r,at:t,src:'manual'}})});
    S.funds.forEach(function(fd){var k='f-a-'+fd.id;if(err||!(k in v))return;var fa=num(v[k]);if(!(fa>=0)){err=fd.name+' の評価額は0以上の数字で入力してください';return}var fl=withAum(fd.ev,t,fa),fe=fundCheck(fl);if(fe){err=fd.name+'：'+fe;return}ops.push(function(){fd.ev=fl})});
    S.debts.forEach(function(d){var k='f-d-'+d.id;if(err||!(k in v))return;var n=num(v[k]);if(!(n>=0)){err=d.name+' の残高は0以上の数字で入力してください';return}ops.push(function(){d.amount=n;d.at=t})});
    S.items.forEach(function(i){var k='f-i-'+i.id;if(err||!(k in v))return;var n=num(v[k]);if(!(n>=0)){err=i.name+' の時価は0以上で入力してください';return}ops.push(function(){i.value=n;i.valueAt=t})});

function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function coreSnap(){return JSON.stringify(S,function(k,v){return /^(at|valueAt|savedAt|history|noRecord|settings|lastFetch|fx)$/.test(k)?undefined:v})}
function done(msg){var b0=S.sample&&!S.sampleEdited?ui.sampleSnap:null,ok=save();if(ok&&b0!=null&&coreSnap()!==b0){S.sampleEdited=true;ok=save()}closeSheet();render();toast(ok?(msg||'保存しました'):'保存できませんでした。容量不足の可能性があります。バックアップを書き出してください')}
function shareText(txt,name,ok){
  try{
    var file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(ok,function(){});return}
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();ok();
  }catch(e){toast('書き出せませんでした')}
}

  delCash:function(d){S.cash=S.cash.filter(function(x){return x.id!==d.id});done('削除しました')},
  delItem:function(d){S.items=S.items.filter(function(x){return x.id!==d.id});done('削除しました')},
  delHist:function(d){if(d.id===today())S.noRecord=today();S.history=S.history.filter(function(x){return x.date!==d.id});done('削除しました')},
  histAuto:function(d){var r=S.history.find(function(x){return x.date===d.id});if(r)delete r.manual;if(d.id===today())S.noRecord=null;done('自動計算に戻しました')},
  wipe:function(){S=blank();ui.gen++;ui.msg='';done('すべて消去しました')},
  exportRescue:function(){
    var raw=rescueText();if(!raw){toast('退避データはありません');return}
    shareText(raw,'shisan-rescue-'+today()+'.json',function(){rescueAck();ui.loadError=false;render();toast('退避データを書き出しました')});
  },
  rescueAck:function(){rescueAck();ui.loadError=false;render()},
  'export':function(){
    var snap=Object.assign({},S,{settings:Object.assign({},S.settings,{lastBackup:Date.now(),snooze:null})});
    var txt=JSON.stringify(snap),name='shisan-backup-'+today()+'.json';
    var showBox=function(){if(!$('#expbox'))sheetSettings();$('#expbox').hidden=false;$('#f-exp').value=txt};
    if($('#expbox'))showBox();
    try{
      var file=new File([txt],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).then(function(){markBackup()},function(err){if(!err||err.name!=='AbortError'){showBox();toast('共有できませんでした。中身をコピーして保管してください')}});
        return;
      }
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
      showBox();markBackup();
    }catch(e){showBox()}
  },
  copy:function(){
    var ta=$('#f-exp');
    var fb=function(){ta.focus();ta.select();toast('選択しました。コピーを押してください')};
    try{navigator.clipboard.writeText(ta.value).then(function(){markBackup('コピーしました。メモなどに貼り付けて保管してください')},fb)}catch(e){fb()}
  },
  snooze:function(){S.settings.snooze=Date.now()+7*864e5;save();render();toast('7日後にもう一度お知らせします')},
  stock:function(){sheetStock()}
};
function armed(el){
  if(!el.dataset.confirm)return true;
  if(el.dataset.armed)return Date.now()-Number(el.dataset.armed)>=450;
  el.dataset.armed=String(Date.now());el.dataset.label=el.textContent;el.textContent=el.dataset.confirm;
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=el.dataset.label}},4000);
  return false;
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(!armed(el))return;
  var f=acts[el.dataset.a];if(f)f(el.dataset);
});
document.addEventListener('submit',function(e){
  var form=e.target.closest('form[data-f]');if(!form)return;
  e.preventDefault();
  var sb=e.submitter;
  if(sb&&!armed(sb))return;
  var v={};new FormData(form).forEach(function(val,k){if(typeof val==='string')v[k]=val});
  var err=dateErr(v)||forms[form.dataset.f](v,sb?sb.value:'');
  var box=form.querySelector('.err');
  if(err){if(box){box.textContent=err;box.hidden=false}return}
  done({'import':'バックアップを読み込みました',stock:'棚卸しを保存しました',bulk:'現在値を保存しました'}[form.dataset.f]||'保存しました');
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-cur'&&$('#fxbox')){$('#fxbox').hidden=t.value==='JPY';var f=S.fx[t.value];$('#f-rate').value=f?f.rate:'';if(ui.orig)ui.orig['f-rate']=$('#f-rate').value}
  if(t.id==='f-file'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){$('#f-imp').value=String(r.result||'')};r.readAsText(t.files[0])}
});

/* ---------- boot ---------- */
S=load();
if(ui.loaded)lastSnap=snapOf();
save();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
try{if('serviceWorker' in navigator&&document.querySelector('link[rel=manifest]'))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
function maybeAutoFetch(){
  if(busy||(S.lastFetch&&Date.now()-S.lastFetch<=30*60*1000))return;
  var need=S.cash.some(function(c){return c.cur!=='JPY'&&(!S.sample||S.sampleEdited)});
  if(need)updateAll(true);
}
setTimeout(maybeAutoFetch,400);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(reloadNewer()&&!$('#sheet').hidden){closeSheet();toast('別の画面でデータが更新されたため、入力画面を閉じました')}
  save();render();
  setTimeout(maybeAutoFetch,400);
});
function reloadNewer(raw){
  if(!storageOK||ui.noSave)return false;
  try{var t=raw!=null?raw:localStorage.getItem(KEY);if(!t)return false;var o=normalize(JSON.parse(t));if(o&&(o.savedAt||0)>(S.savedAt||0)){S=o;lastSnap=snapOf();ui.gen++;ui.noSave=false;ui.loadError=false;return true}}catch(e){}
  return false;
}
window.addEventListener('storage',function(e){
  if(e.key!==KEY||e.newValue==null)return;
  if(reloadNewer(e.newValue)){var open=!$('#sheet').hidden;if(open)closeSheet();render();toast(open?'別の画面でデータが更新されたため、入力画面を閉じました':'別の画面での変更を読み込みました')}
});
document.addEventListener('focusin',function(e){
  var t=e.target;if(!t||!t.closest||!t.closest('#sheet')||!/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;
  setTimeout(function(){try{if(document.activeElement===t)t.scrollIntoView({block:'center'})}catch(x){}},350);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
})();
</script>
</body>
</html>
